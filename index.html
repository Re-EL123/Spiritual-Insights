<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spiritual Insights</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #f3e5f5, #ede7f6);
      color: #4a148c;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    input, button, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background: #7b1fa2;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(123, 31, 162, 0.3);
    }
    .result {
      margin-top: 20px;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 15px;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .result strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Spiritual Insights</h1>
    <p>Enter your details to receive your full spiritual reading.</p>

    <input type="date" id="dob" />
    <input type="time" id="tob" placeholder="Time of birth (optional)" />
    <input type="text" id="place" placeholder="Place of birth (City/Country)" />
    <button onclick="generateInsights()">Reveal My Reading 🔮</button>
    <button onclick="viewPastReadings()">View My Past Readings 📖</button>

    <div class="result" id="output"></div>
    <button id="pdfBtn" style="display:none" onclick="downloadPDF()">📄 Download PDF</button>
  </div>

  <script>
    const angelNumbers = [
      { number: 111, message: "New beginnings are on the way. Trust your path." },
      { number: 222, message: "You are in the right place at the right time." },
      { number: 333, message: "Your spiritual guides are surrounding you with love." },
      { number: 444, message: "You are protected. Keep going, you're supported." },
      { number: 555, message: "Big changes are ahead. Stay centered." },
      { number: 777, message: "You're in alignment with divine wisdom." },
      { number: 888, message: "Abundance and balance are flowing into your life." },
      { number: 999, message: "A chapter is ending. Get ready to level up." }
    ];

    const tarotDeck = [
      "The Fool", "The Magician", "The High Priestess", "The Empress", "The Emperor",
      "The Hierophant", "The Lovers", "The Chariot", "Strength", "The Hermit",
      "Wheel of Fortune", "Justice", "The Hanged Man", "Death", "Temperance",
      "The Devil", "The Tower", "The Star", "The Moon", "The Sun",
      "Judgement", "The World"
    ];

    function sumDigits(n) {
      return n.toString().split('').reduce((a, b) => a + parseInt(b), 0);
    }

    function reduceToOneDigit(n) {
      while (n > 9 && ![11, 22, 33].includes(n)) {
        n = sumDigits(n);
      }
      return n;
    }

    function getLifePathNumber(date) {
      const [year, month, day] = date.split("-").map(Number);
      const sum = sumDigits(year) + sumDigits(month) + sumDigits(day);
      return reduceToOneDigit(sum);
    }

    function getSunSign(month, day) {
      const signs = [
        { sign: "Capricorn", end: 19 }, { sign: "Aquarius", end: 18 },
        { sign: "Pisces", end: 20 }, { sign: "Aries", end: 19 },
        { sign: "Taurus", end: 20 }, { sign: "Gemini", end: 20 },
        { sign: "Cancer", end: 22 }, { sign: "Leo", end: 22 },
        { sign: "Virgo", end: 22 }, { sign: "Libra", end: 22 },
        { sign: "Scorpio", end: 21 }, { sign: "Sagittarius", end: 21 },
        { sign: "Capricorn", end: 31 }
      ];
      return day <= signs[month - 1].end ? signs[month - 1].sign : signs[month].sign;
    }

    function getRandomAngelNumber() {
      return angelNumbers[Math.floor(Math.random() * angelNumbers.length)];
    }

    function getRandomTarotCards() {
      const shuffled = tarotDeck.sort(() => 0.5 - Math.random());
      return shuffled.slice(0, 3);
    }

    function generateInsights() {
      const dob = document.getElementById("dob").value;
      const tob = document.getElementById("tob").value || "Unknown";
      const place = document.getElementById("place").value || "Unknown";
      if (!dob) return alert("Please select your date of birth.");

      const lifePath = getLifePathNumber(dob);
      const [year, month, day] = dob.split("-").map(Number);
      const sunSign = getSunSign(month, day);
      const angel = getRandomAngelNumber();
      const tarot = getRandomTarotCards();

      const reading = `
        🌟 Life Path Number: ${lifePath}\n
        ☀️ Sun Sign: ${sunSign}\n
        📍 Birth Chart Info: Time - ${tob}, Place - ${place}\n
        🔢 Angel Number: ${angel.number} - ${angel.message}\n
        🃏 Tarot Cards Drawn:\n• ${tarot[0]}\n• ${tarot[1]}\n• ${tarot[2]}
      `;

      document.getElementById("output").innerHTML = `
        <strong>🌟 Life Path Number:</strong> ${lifePath}<br>
        Your Life Path Number symbolizes your core purpose and spiritual lessons.<br><br>
        <strong>☀️ Sun Sign:</strong> ${sunSign}<br>
        Your sun sign reflects your personality and identity.<br><br>
        <strong>📍 Birth Chart Info:</strong><br>
        Time: ${tob}<br>Place: ${place}<br><br>
        <strong>🔢 Angel Number:</strong> ${angel.number}<br>
        <em>${angel.message}</em><br><br>
        <strong>🃏 Tarot Cards:</strong><br>
        Past: ${tarot[0]}<br>
        Present: ${tarot[1]}<br>
        Future: ${tarot[2]}<br>
      `;

      document.getElementById("pdfBtn").style.display = 'block';

      const history = JSON.parse(localStorage.getItem("readings") || "[]");
      history.push({ dob, tob, place, lifePath, sunSign, angel, tarot, date: new Date().toLocaleString() });
      localStorage.setItem("readings", JSON.stringify(history));
    }

    function viewPastReadings() {
      const history = JSON.parse(localStorage.getItem("readings") || "[]");
      if (history.length === 0) {
        alert("No past readings found.");
        return;
      }

      let message = "🔮 Your Past Readings:\n\n";
      history.slice(-5).reverse().forEach((r, i) => {
        message += `#${i + 1} - ${r.date}\nLife Path: ${r.lifePath}, Sun Sign: ${r.sunSign}, Angel: ${r.angel.number}\n\n`;
      });

      alert(message);
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text(document.getElementById("output").innerText, 10, 10);
      doc.save("spiritual-reading.pdf");
    }
  </script>

</body>
</html>
