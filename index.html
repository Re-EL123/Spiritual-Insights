<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spiritual Insights</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #f3e5f5, #ede7f6);
      color: #4a148c;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    input, button, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #7b1fa2;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(123, 31, 162, 0.3);
    }

    .result {
      margin-top: 20px;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 15px;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .result strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Spiritual Insights</h1>
    <p>Enter your birth details to receive a full spiritual reading including your Life Path Number, Sun Sign, Birth Chart insights, Angel Number and a Tarot reading.</p>

    <input type="date" id="dob" />
    <input type="time" id="birthTime" />
    <input type="text" id="birthCity" placeholder="City of Birth" />
    <button onclick="generateInsights()">Reveal My Reading 🔮</button>
    <button onclick="showPastReadings()">View My Past Readings 📜</button>

    <div class="result" id="output"></div>
  </div>

  <script>
    const angelNumbers = [
      { number: 111, message: "New beginnings are on the way. Trust your path." },
      { number: 222, message: "You are in the right place at the right time." },
      { number: 333, message: "Your spiritual guides are surrounding you with love." },
      { number: 444, message: "You are protected. Keep going, you're supported." },
      { number: 555, message: "Big changes are ahead. Stay centered." },
      { number: 777, message: "You're in alignment with divine wisdom." },
      { number: 888, message: "Abundance and balance are flowing into your life." },
      { number: 999, message: "A chapter is ending. Get ready to level up." }
    ];

    const tarotCards = [
      { card: "The Fool", meaning: "New beginnings, spontaneity, free spirit." },
      { card: "The Magician", meaning: "Manifestation, resourcefulness, power." },
      { card: "The High Priestess", meaning: "Intuition, mystery, inner voice." },
      { card: "The Empress", meaning: "Femininity, beauty, nature, nurture." },
      { card: "The Emperor", meaning: "Authority, structure, father-figure." },
      { card: "The Lovers", meaning: "Love, harmony, values alignment." },
      { card: "The Chariot", meaning: "Control, willpower, determination." },
      { card: "Strength", meaning: "Courage, influence, compassion." },
      { card: "The Hermit", meaning: "Soul-searching, introspection, inner guidance." }
    ];

    function sumDigits(n) {
      return n.toString().split('').reduce((a, b) => a + parseInt(b), 0);
    }

    function reduceToOneDigit(n) {
      while (n > 9 && ![11, 22, 33].includes(n)) {
        n = sumDigits(n);
      }
      return n;
    }

    function getLifePathNumber(date) {
      const [year, month, day] = date.split("-").map(Number);
      const sum = sumDigits(year) + sumDigits(month) + sumDigits(day);
      return reduceToOneDigit(sum);
    }

    function getSunSign(month, day) {
      const signs = [
        { sign: "Capricorn", end: 19 }, { sign: "Aquarius", end: 18 },
        { sign: "Pisces", end: 20 }, { sign: "Aries", end: 19 },
        { sign: "Taurus", end: 20 }, { sign: "Gemini", end: 20 },
        { sign: "Cancer", end: 22 }, { sign: "Leo", end: 22 },
        { sign: "Virgo", end: 22 }, { sign: "Libra", end: 22 },
        { sign: "Scorpio", end: 21 }, { sign: "Sagittarius", end: 21 },
        { sign: "Capricorn", end: 31 }
      ];
      return day <= signs[month - 1].end ? signs[month - 1].sign : signs[month].sign;
    }

    function getRandomAngelNumber() {
      return angelNumbers[Math.floor(Math.random() * angelNumbers.length)];
    }

    function drawTarotCards() {
      const shuffled = tarotCards.sort(() => 0.5 - Math.random());
      return shuffled.slice(0, 3);
    }

    function saveReadingLocally(data) {
      let history = JSON.parse(localStorage.getItem("readings")) || [];
      history.push(data);
      localStorage.setItem("readings", JSON.stringify(history));
    }

    function showPastReadings() {
      const readings = JSON.parse(localStorage.getItem("readings")) || [];
      if (readings.length === 0) return alert("No past readings found.");
      let html = `<h2>📜 Past Readings</h2>`;
      readings.forEach((r, i) => {
        html += `<div class='result'><strong>Reading #${i+1}</strong><br>${r.html}</div><br>`;
      });
      document.getElementById("output").innerHTML = html;
    }

    function downloadPDF(content) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text(content, 10, 10);
      doc.save("Spiritual_Insight_Reading.pdf");
    }

    function generateInsights() {
      const dob = document.getElementById("dob").value;
      const time = document.getElementById("birthTime").value;
      const city = document.getElementById("birthCity").value;
      if (!dob || !time || !city) return alert("Please complete all fields.");

      const lifePath = getLifePathNumber(dob);
      const [year, month, day] = dob.split("-").map(Number);
      const sunSign = getSunSign(month, day);
      const angel = getRandomAngelNumber();
      const tarot = drawTarotCards();

      const html = `
        <strong>🌟 Life Path Number:</strong> ${lifePath}<br>
        Your Life Path Number symbolizes your core purpose and spiritual lessons.<br><br>

        <strong>☀️ Sun Sign:</strong> ${sunSign}<br>
        Your sun sign reflects your personality and identity.<br><br>

        <strong>📍 Birth Info:</strong><br>
        Time: ${time}<br>
        City: ${city}<br><br>

        <strong>🔮 Birth Chart (Basic):</strong><br>
        Sun in ${sunSign}. (More detailed analysis coming soon!)<br><br>

        <strong>🔢 Today's Angel Number:</strong> ${angel.number}<br>
        <em>${angel.message}</em><br><br>

        <strong>🃏 Tarot Reading (Past, Present, Future):</strong><br>
        ${tarot.map(card => `<b>${card.card}</b>: ${card.meaning}`).join("<br>")}<br><br>

        <button onclick="downloadPDF(this.parentElement.innerText)">Download PDF</button>
      `;

      document.getElementById("output").innerHTML = `<div class='result'>${html}</div>`;
      saveReadingLocally({ html });
    }
  </script>

</body>
</html>
